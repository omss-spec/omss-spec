openapi: 3.0.3

info:
    title: Open Media Streaming Specification (OMSS)
    description: |
        OMSS (Open Media Streaming Specification) v1.1 defines a unified REST API
        standard for streaming media backends. It enables any frontend application
        to work with any OMSS-compliant backend through standardized endpoints for
        retrieving streaming sources and subtitles for TMDB media identifiers.

        **Key Features:**
        - Standardized endpoints for movies and TV episodes
        - Multi-language and multi-quality source support
        - Subtitle support with multiple formats
        - Diagnostic reporting for partial scrapes

        **OMSS Framework:** [github.com/omss-spec/framework](https://github.com/omss-spec/framework)

        **OMSS Template:** [github.com/omss-spec/template](https://github.com/omss-spec/template)

        **OMSS SDK:** [github.com/omss-spec/sdk](https://github.com/omss-spec/sdk)
    version: 1.1.0
    license:
        name: MIT License
        url: https://github.com/omss-spec/omss-spec/blob/main/LICENSE
    contact:
        name: OMSS Community
        url: https://github.com/omss-spec/omss-spec

servers:
    - url: http://localhost:{port}
      description: Development server (localhost only)
      variables:
          port:
              default: '3000'
              description: Port
    - url: https://{domain}
      description: Production server
      variables:
          domain:
              default: 'api.example.com'
              description: Your hosted OMSS server

tags:
    - name: General
      description: General information and status endpoints
    - name: Content
      description: Retrieve sources for movies and TV shows
    - name: Refresh
      description: Refresh cached sources

paths:

  /:
    get:
      tags: [General]
      summary: Root information endpoint
      responses:
        "200":
          description: Service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeResponse"

  /v1:
    get:
      tags: [General]
      summary: Versioned root endpoint
      responses:
        "200":
          description: Service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeResponse"

  /v1/movies/{id}:
    get:
      tags: [Content]
      summary: Get movie streaming sources by TMDB ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: TMDB movie ID (numeric string)
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [web, native]
            default: web
          description: Platform-specific response format
      responses:
        "200":
          description: Movie sources response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found or no sources available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "406":
          description: Not acceptable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/tv/{id}/seasons/{s}/episodes/{e}:
    get:
      tags: [Content]
      summary: Get TV episode streaming sources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: s
          in: path
          required: true
          schema:
            type: integer
        - name: e
          in: path
          required: true
          schema:
            type: integer
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [web, native]
            default: web
      responses:
        "200":
          description: Episode sources response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found or no sources available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/refresh/{id}:
    post:
      tags: [Refresh]
      summary: Refresh cached response by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "404":
          description: Response ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:

  schemas:

    HomeResponse:
      type: object
      required:
        - name
        - version
        - status
        - endpoints
        - spec
        - media
      properties:
        name:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [operational, degraded, down]
        spec:
          type: string
          enum: [omss]
        note:
          type: string
        endpoints:
          type: object
          properties:
            movie:
              type: string
            tv:
              type: string
        media:
          type: object
          properties:
            movies:
              oneOf:
                - type: array
                  items:
                    type: integer
                - type: string
                  enum: ["*"]
            tv:
              oneOf:
                - type: array
                  items:
                    $ref: "#/components/schemas/TVAvailability"
                - type: string
                  enum: ["*"]

    TVAvailability:
      type: object
      required: [id, seasons]
      properties:
        id:
          type: integer
        seasons:
          type: array
          items:
            type: object
            required: [season, episodes]
            properties:
              season:
                type: integer
              episodes:
                type: array
                items:
                  type: integer

    MediaResponse:
      type: object
      required: [id, sources, subtitles, diagnostics]
      properties:
        id:
          type: string
        expiresAt:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/Subtitle"
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"

    Source:
      type: object
      required: [id, url, streamable, type, quality, audioTracks, provider]
      properties:
        id:
          type: string
        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        streamable:
          type: boolean
        type:
          type: string
          enum: [hls, mp4, mkv]
        quality:
          type: string
          enum: [8K, 4K, 2K, FHD, HD, SD, Auto]
        audioTracks:
          type: array
          items:
            type: string
        provider:
          $ref: "#/components/schemas/Provider"

    Subtitle:
      type: object
      required: [id, url, label, format, provider]
      properties:
        id:
          type: string
        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        label:
          type: string
        format:
          type: string
          enum: [vtt, srt]
        provider:
          $ref: "#/components/schemas/Provider"

    Provider:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    Diagnostic:
      type: object
      required: [code, message, severity]
      properties:
        code:
          type: string
        message:
          type: string
        source:
          type: string
        severity:
          type: string
          enum: [warning, error]

    ErrorResponse:
      type: object
      required: [error, traceId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        traceId:
          type: string

    RefreshResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [OK]